<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Bot Web Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
    input { background: #2c2c2c; color: #fff; }
    button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
    button.stop { background: #f44336; }
    button:hover { opacity: 0.9; }
    #logs { background: #000; padding: 15px; height: 220px; overflow-y: scroll; font-family: monospace; border-radius: 5px; color: #00ff00; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Minecraft Bot Web Panel</h2>
    
    <label>Server IP:</label>
    <input type="text" id="host" placeholder="e.g. myserver.aternos.me">
    
    <label>Server Port:</label>
    <input type="number" id="port" value="25565">
    
    <label>Bot Username:</label>
    <input type="text" id="username" value="AfnanBot">
    
    <button onclick="startBot()">Start Bot</button>
    <button class="stop" onclick="stopBot()">Stop Bot</button>
    
    <h3>Live Logs:</h3>
    <div id="logs"><div>Yahan bots ke status show honge...</div></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function startBot() {
      const host = document.getElementById('host').value;
      const port = document.getElementById('port').value;
      const username = document.getElementById('username').value;
      
      if (!host) {
        alert('Baraye meharbani Server IP darj karein!');
        return;
      }
      socket.emit('start-bot', { host, port, username });
    }

    function stopBot() {
      const host = document.getElementById('host').value;
      const username = document.getElementById('username').value;
      socket.emit('stop-bot', { host, username });
    }

    socket.on('bot-log', (msg) => {
      const logs = document.getElementById('logs');
      logs.innerHTML += `<div>> ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    });
  </script>
</body>
</html>
