<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minecraft Bot Mobile Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #f3f4f6; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; background: #111827; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
    h2 { text-align: center; margin-bottom: 15px; color: #10b981; font-size: 22px; }
    .status-badge { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; font-size: 13px; background: #1f2937; padding: 8px; border-radius: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .dot.connected { background: #10b981; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #9ca3af; font-weight: 500; }
    input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #10b981; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: opacity 0.2s; }
    button.start { background: #10b981; }
    button.stop { background: #ef4444; }
    button:active { opacity: 0.8; }
    h3 { margin-top: 20px; margin-bottom: 8px; font-size: 15px; color: #9ca3af; }
    #logs { background: #030712; padding: 12px; height: 180px; overflow-y: scroll; font-family: monospace; border-radius: 8px; color: #4ade80; font-size: 13px; border: 1px solid #1f2937; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Minecraft Bot Panel</h2>
    
    <div class="status-badge">
      <div id="status-dot" class="dot"></div>
      <span id="status-text">Connecting to server...</span>
    </div>

    <label>Server IP</label>
    <input type="text" id="host" placeholder="myserver.aternos.me" autocapitalize="none" autocorrect="off">
    
    <label>Server Port</label>
    <input type="number" id="port" value="25565">
    
    <label>Bot Username</label>
    <input type="text" id="username" value="AfnanBot" autocapitalize="none" autocorrect="off">
    
    <div class="btn-group">
      <button class="start" onclick="startBot()">Start Bot</button>
      <button class="stop" onclick="stopBot()">Stop Bot</button>
    </div>
    
    <h3>Live Logs</h3>
    <div id="logs"><div>System ready...</div></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(window.location.origin, {
      transports: ['polling', 'websocket']
    });

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    socket.on('connect', () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'Connected to Server (Online)';
    });

    socket.on('disconnect', () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Disconnected from Server';
    });

    function startBot() {
      const host = document.getElementById('host').value.trim();
      const port = document.getElementById('port'].value.trim();
      const username = document.getElementById('username').value.trim();
      
      if (!host) {
        alert('Baraye meharbani Server IP darj karein!');
        return;
      }
      socket.emit('start-bot', { host, port, username });
    }

    function stopBot() {
      const host = document.getElementById('host').value.trim();
      const username = document.getElementById('username').value.trim();
      socket.emit('stop-bot', { host, username });
    }

    socket.on('bot-log', (msg) => {
      const logs = document.getElementById('logs');
      logs.innerHTML += `<div>> ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    });
  </script>
</body>
</html>
